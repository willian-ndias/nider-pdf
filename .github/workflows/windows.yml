name: Nider PDF para Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fontes do WordCraft (craft-fonts)
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: nider-pdf-windows-x64
      # O PdfCraft fixa a versão (0.9.0) nas dependências internas e o `xtask version set`
      # não aceita voltar para 0.1.x: troca direto no Cargo.toml e no Cargo.lock.
      - name: Aplicar a versão da etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          t = open("Cargo.toml", encoding="utf-8").read()
          n = t.count('"0.9.0"')
          t = t.replace('"0.9.0"', '"%s"' % v)
          open("Cargo.toml", "w", encoding="utf-8").write(t)
          l = open("Cargo.lock", encoding="utf-8").read()
          cont = 0
          def troca(m):
              global cont
              b = m.group(0)
              nome = re.search(r'name = "([^"]+)"', b).group(1)
              if (nome.startswith("pdfcraft") or nome == "xtask") and 'version = "0.9.0"' in b:
                  cont += 1
                  return b.replace('version = "0.9.0"', 'version = "%s"' % v, 1)
              return b
          l = re.sub(r"\[\[package\]\]\n(?:(?!\[\[package\]\]).)*?(?=\n\n|\Z)", troca, l, flags=re.S)
          open("Cargo.lock", "w", encoding="utf-8").write(l)
          print("versao", v, "| Cargo.toml:", n, "| Cargo.lock:", cont)
          if n == 0 or cont == 0:
              raise SystemExit("nada foi trocado")
      - name: Instalar WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g "WixToolset.UI.wixext/5.0.2" "WixToolset.Util.wixext/5.0.2"
      - name: Compilar e empacotar
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Instalador personalizado (NiderPdfSetup.exe)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/release -Filter "pdfcraft-*-portable.zip" | Select-Object -First 1
          if (-not $zip) { throw "zip portátil não encontrado" }
          Copy-Item $zip.FullName installer/NiderPdfSetup/payload.zip
          $v = ($zip.Name -replace '^pdfcraft-', '' -replace '-windows-x64-portable\.zip$', '')
          $v3 = ($v -split '-')[0]
          dotnet publish installer/NiderPdfSetup -c Release -p:Version=$v3 -o dist/setup
          if ($LASTEXITCODE -ne 0) { throw "falha ao compilar o instalador" }
          Copy-Item dist/setup/NiderPdfSetup.exe "dist/release/nider-pdf-setup-$v-windows-x64.exe"
      - name: Renomear arquivos
        shell: pwsh
        run: |
          Get-ChildItem dist/release -File | Where-Object { $_.Name -like 'pdfcraft-*' } | ForEach-Object {
            Rename-Item $_.FullName ($_.Name -replace '^pdfcraft-', 'nider-pdf-')
          }
          Get-ChildItem dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: nider-pdf-windows-x64
          path: dist/release/*
          if-no-files-found: error
      - name: Notas da versão (o que mudou desde a versão anterior)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          atual="${GITHUB_REF_NAME}"
          git rev-parse -q --verify "refs/tags/$atual" >/dev/null || atual="HEAD"
          anterior=$(git describe --tags --abbrev=0 --match 'v*' "$atual^" 2>/dev/null || true)
          {
            echo "## O que há de novo"
            echo
            git log ${anterior:+$anterior..}$atual --no-merges --pretty='- %s' \
              | grep -v -i -E 'dependabot|^- (bump|chore\(deps\)|ci\(deps\))|ui_shot|^- Merge |^- (Compilação|Empacotamento|Notas da versão|Instalador:)' | head -40 || true
            echo
            echo "_Se o Windows avisar que o aplicativo não é reconhecido, clique em **Mais informações** e depois em **Executar assim mesmo**._"
          } > notas.md
          cat notas.md
      - name: Publicar versão no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/release/nider-pdf-* --title "Nider PDF $tag" --prerelease \
            --notes-file notas.md
